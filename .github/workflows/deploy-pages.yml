name: Deploy tutorial site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if Pages is enabled
        id: pages_check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "enabled=$( [ "$code" = "200" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - name: Show hint when Pages is not enabled
        if: steps.pages_check.outputs.enabled != 'true'
        run: |
          echo "Pages 尚未启用，跳过部署。请到 Settings → Pages 开启（Deploy from a branch - main/root，或 GitHub Actions）。"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_check.outputs.enabled == 'true'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
